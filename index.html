<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Track Smart Sorter (Pro AI Edition)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 1200px; margin: 0 auto; }
        h1 { color: #00ffcc; text-align: center; }
        .upload-box { border: 2px dashed #00ffcc; border-radius: 12px; padding: 40px; text-align: center; background: #1e1e1e; cursor: pointer; margin-bottom: 20px; }
        .upload-box:hover { background: #2a2a2a; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #1e1e1e; border-radius: 8px; overflow: hidden; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #252525; color: #00ffcc; }
        tr:hover { background: #2c2c2c; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; margin-bottom: 4px; }
        .camelot { background: #ffa502; color: #000; }
        .genre { background: #8c7ae6; color: #fff; }
        .bpm-fix { background: #ff4757; color: #fff; font-size: 10px; padding: 2px 4px; border-radius: 3px; margin-left: 5px; }
    </style>
</head>
<body>

    <h1>🎧 DJ 智能排歌工具 (真・DJ 邏輯分析版)</h1>
    
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <h3>點擊或拖放 Rekordbox 匯出的 .txt 至此處</h3>
        <p>（自動修復 BPM 減半錯誤、自動轉換 Camelot Key、計算和弦接歌）</p>
        <input type="file" id="fileInput" accept=".txt" style="display: none;" onchange="handleFile(this.files[0])">
    </div>

    <div id="results" style="display:none;">
        <h2>📋 智能推薦順序</h2>
        <table id="playlistTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>歌名</th>
                    <th>BPM</th>
                    <th>Camelot Key</th>
                    <th>曲風</th>
                    <th>接歌分析 (Flow)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        // 音樂調號轉 Camelot Key 的字典
        const keyMap = {
            'Abm':'1A', 'G#m':'1A', 'B':'1B',
            'Ebm':'2A', 'D#m':'2A', 'F#':'2B', 'Gb':'2B',
            'Bbm':'3A', 'A#m':'3A', 'Db':'3B', 'C#':'3B',
            'Fm':'4A', 'Ab':'4B', 'G#':'4B',
            'Cm':'5A', 'Eb':'5B', 'D#':'5B',
            'Gm':'6A', 'Bb':'6B', 'A#':'6B',
            'Dm':'7A', 'F':'7B',
            'Am':'8A', 'C':'8B',
            'Em':'9A', 'G':'9B',
            'Bm':'10A', 'D':'10B',
            'F#m':'11A', 'Gbm':'11A', 'A':'11B',
            'Dbm':'12A', 'C#m':'12A', 'E':'12B'
        };

        function handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { parseRekordboxTxt(e.target.result); };
            reader.readAsText(file, 'utf-16le'); 
        }

        function parseRekordboxTxt(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            if (lines.length < 2) return alert("檔案格式錯誤！");

            const headers = lines[0].split('\t').map(h => h.toLowerCase().replace(/"/g, ''));
            const trackIdx = headers.findIndex(h => h.includes('track') || h.includes('名稱'));
            const bpmIdx = headers.findIndex(h => h === 'bpm');
            const keyIdx = headers.findIndex(h => h === 'key' || h.includes('調號'));
            const genreIdx = headers.findIndex(h => h === 'genre' || h.includes('類型'));

            let tracks = [];

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split('\t').map(c => c.replace(/"/g, ''));
                if (cols.length > bpmIdx) {
                    let rawName = cols[trackIdx] || 'Unknown';
                    let rawBpm = parseFloat(cols[bpmIdx]) || 0;
                    let rawKey = keyIdx !== -1 ? cols[keyIdx] : '';
                    let rawGenre = genreIdx !== -1 ? (cols[genreIdx] || 'Unknown') : 'Unknown';
                    
                    // 1. 智能 BPM 修復 (Double-time Fix)
                    let isBpmFixed = false;
                    // 檢查歌名是否有寫 bpm (例如 174bpm)
                    const titleBpmMatch = rawName.match(/(\d{2,3})\s*bpm/i);
                    if (titleBpmMatch) {
                        let titleBpm = parseFloat(titleBpmMatch[1]);
                        if (Math.abs(titleBpm - (rawBpm * 2)) < 2) {
                            rawBpm = titleBpm;
                            isBpmFixed = true;
                        }
                    } 
                    // 如果還是很低，且是 D&B/Jungle，強制 * 2
                    else if (rawBpm > 60 && rawBpm <= 95 && (rawGenre.includes("Drum & Bass") || rawGenre.includes("Jungle"))) {
                        rawBpm = rawBpm * 2;
                        isBpmFixed = true;
                    }

                    // 2. 轉換 Camelot Key
                    let camelotKey = keyMap[rawKey] || rawKey;

                    tracks.push({
                        name: rawName,
                        bpm: rawBpm,
                        isBpmFixed: isBpmFixed,
                        key: camelotKey,
                        genre: rawGenre
                    });
                }
            }

            // 按照真實 BPM 排序
            tracks.sort((a, b) => a.bpm - b.bpm);
            generateAdvice(tracks);
            renderResults(tracks);
            document.getElementById('results').style.display = 'block';
        }

        // 3. 智能接歌分析 (Harmonic Mixing)
        function generateAdvice(tracks) {
            for (let i = 0; i < tracks.length; i++) {
                if (i === tracks.length - 1) {
                    tracks[i].advice = "🏁 壓軸歌曲";
                    continue;
                }

                const current = tracks[i];
                const next = tracks[i + 1];
                let adviceArr = [];

                // BPM 檢查
                let bpmDiff = next.bpm - current.bpm;
                if (bpmDiff > 5) {
                    adviceArr.push("🚨 BPM 斷層大跳躍 (建議用 Echo Out 或 Breakdown 切換)");
                } else {
                    adviceArr.push("🔵 BPM 順暢");
                }

                // 和弦檢查 (Camelot 邏輯)
                if (current.key && next.key && current.key !== 'Unknown' && next.key !== 'Unknown') {
                    let cNum = parseInt(current.key.slice(0, -1));
                    let cLetter = current.key.slice(-1);
                    let nNum = parseInt(next.key.slice(0, -1));
                    let nLetter = next.key.slice(-1);

                    if (current.key === next.key) {
                        adviceArr.push("🟢 完美同 Key (可長混音)");
                    } else if (cLetter === nLetter && (Math.abs(cNum - nNum) === 1 || Math.abs(cNum - nNum) === 11)) {
                        adviceArr.push("🟢 相鄰 Key 和諧混音 (Harmonic)");
                    } else if (cNum === nNum && cLetter !== nLetter) {
                        adviceArr.push("🟡 大小調切換 (Energy Boost)");
                    } else {
                        adviceArr.push("⚠️ Key 衝突 (建議不要疊加旋律)");
                    }
                }

                // 曲風檢查
                if (current.genre !== next.genre && current.genre !== 'Unknown' && next.genre !== 'Unknown') {
                    adviceArr.push(`🔄 曲風切換 ➔ ${next.genre}`);
                }

                tracks[i].advice = adviceArr.join(" | ");
            }
        }

        function renderResults(tracks) {
            const tbody = document.querySelector('#playlistTable tbody');
            tbody.innerHTML = '';

            tracks.forEach((track, index) => {
                let bpmDisplay = `<strong>${track.bpm.toFixed(0)}</strong>`;
                if (track.isBpmFixed) bpmDisplay += `<span class="bpm-fix">已修正 Half-time</span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${index + 1}</strong></td>
                    <td style="max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${track.name}">${track.name}</td>
                    <td>${bpmDisplay}</td>
                    <td><span class="badge camelot">${track.key || '-'}</span></td>
                    <td><span class="badge genre">${track.genre}</span></td>
                    <td style="font-size: 13px;">${track.advice}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
