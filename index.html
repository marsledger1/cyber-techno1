<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Track Smart Sorter (Rekordbox Sync Edition)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 1050px; margin: 0 auto; }
        h1 { color: #00ffcc; text-align: center; }
        .upload-box { border: 2px dashed #00ffcc; border-radius: 12px; padding: 40px; text-align: center; background: #1e1e1e; cursor: pointer; margin-bottom: 20px; }
        .upload-box:hover { background: #2a2a2a; }
        .btn-group { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        button { background: #00ffcc; color: #000; font-weight: bold; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:hover { background: #00d6a8; transform: translateY(-2px); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #252525; color: #00ffcc; }
        tr:hover { background: #2c2c2c; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; margin-bottom: 4px; }
        .camelot { background: #ffa502; color: #000; }
        .genre { background: #8c7ae6; color: #fff; }
    </style>
</head>
<body>

    <h1>🎧 DJ 智能排歌工具 (Rekordbox 準確數據版)</h1>
    
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <h3>點擊或拖放 Rekordbox 匯出的 .txt 播放清單至此處</h3>
        <p>（讀取 Rekordbox 準確 BPM 與 Key 數據，瞬間完成排序）</p>
        <input type="file" id="fileInput" accept=".txt" style="display: none;" onchange="handleFile(this.files[0])">
    </div>

    <div id="results" style="display:none;">
        <div class="btn-group">
            <h2>📋 推薦播放順序（依 BPM 慢至快 + 防撞 Flow 建議）</h2>
        </div>
        <table id="playlistTable">
            <thead>
                <tr>
                    <th>次序</th>
                    <th>歌名</th>
                    <th>歌手</th>
                    <th>BPM</th>
                    <th>Key</th>
                    <th>曲風 (Genre)</th>
                    <th>接歌建議 (Flow)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        function handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const content = e.target.result;
                parseRekordboxTxt(content);
            };
            
            // Rekordbox 匯出的 txt 通常是 UTF-16LE 或 UTF-8
            reader.readAsText(file, 'utf-16le'); 
        }

        function parseRekordboxTxt(text) {
            // 解析 TSV (Tab-Separated Values)
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            if (lines.length < 2) {
                alert("檔案格式似乎不正確，請確定是從 Rekordbox 匯出的 .txt 播放清單！");
                return;
            }

            const headers = lines[0].split('\t').map(h => h.toLowerCase().replace(/"/g, ''));
            
            // 找出關鍵欄位的索引位置
            const trackIdx = headers.findIndex(h => h.includes('track title') || h.includes('名稱') || h.includes('曲名'));
            const artistIdx = headers.findIndex(h => h.includes('artist') || h.includes('演出者'));
            const bpmIdx = headers.findIndex(h => h === 'bpm');
            const keyIdx = headers.findIndex(h => h === 'key' || h.includes('調號'));
            const genreIdx = headers.findIndex(h => h === 'genre' || h.includes('類型') || h.includes('曲風'));

            if (trackIdx === -1 || bpmIdx === -1) {
                alert("找不到 BPM 或歌曲名稱欄位，請確認你的 Rekordbox 欄位有顯示這兩項！");
                return;
            }

            let tracks = [];

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split('\t').map(c => c.replace(/"/g, ''));
                if (cols.length > bpmIdx) {
                    tracks.push({
                        name: cols[trackIdx] || 'Unknown',
                        artist: artistIdx !== -1 ? cols[artistIdx] : '',
                        bpm: parseFloat(cols[bpmIdx]) || 0,
                        key: keyIdx !== -1 ? cols[keyIdx] : '',
                        genre: genreIdx !== -1 ? (cols[genreIdx] || 'Unknown') : 'Unknown'
                    });
                }
            }

            // 核心排序：依照 BPM 慢到快
            tracks.sort((a, b) => a.bpm - b.bpm);
            generateAdvice(tracks);
            renderResults(tracks);
            document.getElementById('results').style.display = 'block';
        }

        function generateAdvice(tracks) {
            for (let i = 0; i < tracks.length; i++) {
                if (i < tracks.length - 1) {
                    const current = tracks[i];
                    const next = tracks[i + 1];
                    
                    if (current.genre !== next.genre && current.genre !== 'Unknown' && next.genre !== 'Unknown') {
                        current.advice = `⚠️ 曲風轉換 (${current.genre} ➔ ${next.genre})`;
                    } else if (current.key === next.key && current.key !== '') {
                        current.advice = "🟢 同 Key 無縫混音 (Harmonic Mix)";
                    } else if (next.bpm - current.bpm > 3) {
                        current.advice = "🟡 BPM 跳躍較大，建議使用效果器或 Breakdown 時切換";
                    } else {
                        current.advice = "🔵 BPM 平穩過渡";
                    }
                } else {
                    tracks[i].advice = "🏁 壓軸歌曲";
                }
            }
        }

        function renderResults(tracks) {
            const tbody = document.querySelector('#playlistTable tbody');
            tbody.innerHTML = '';

            tracks.forEach((track, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${index + 1}</strong></td>
                    <td>${track.name}</td>
                    <td>${track.artist}</td>
                    <td><strong>${track.bpm.toFixed(2)}</strong></td>
                    <td><span class="badge camelot">${track.key || '-'}</span></td>
                    <td><span class="badge genre">${track.genre}</span></td>
                    <td>${track.advice}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
